<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habib's Marriage Contract</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 500px; background: #1e293b; padding: 30px; border-radius: 20px; position: relative; min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 24px; color: #f43f5e; margin-bottom: 20px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin: 10px; transition: 0.2s; }
        #yes-btn { background: #22c55e; color: white; }
        #no-btn { background: #ef4444; color: white; position: absolute; }
        .menu-item { margin: 10px; padding: 10px; background: #334155; cursor: pointer; border-radius: 5px; }
        .menu-item:hover { background: #475569; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="page1">
    <h1>Shaadi karni hai toh form fill karo!</h1>
    <button class="btn" id="yes-btn" onclick="nextPage('page2')">Yes</button>
    <button class="btn" id="no-btn" onmouseover="moveNoButton()">No</button>
    <p id="error1" class="hidden" style="color: #f87171;">Ek option toh choose karna padega!</p>
</div>

<div class="container hidden" id="page2">
    <h1>Shaadi ke baad mai azaad rahunga, jab man karega tab ghar aaunga (12 bje ya 2 bje).</h1>
    <button class="btn" id="yes-btn" onclick="nextPage('page3')">Theek hai</button>
    <button class="btn" id="no-btn" onmouseover="moveNoButton()">Nahi</button>
</div>

<div class="container hidden" id="page3">
    <h1>Dinner Menu Select Karo:</h1>
    <div class="menu-item" onclick="nextPage('page4')">Masala Dosa</div>
    <div class="menu-item" onclick="nextPage('page4')">Idli Vada</div>
    <div class="menu-item" onclick="nextPage('page4')">Uttapam</div>
</div>

<div class="container hidden" id="page4">
    <h1>Shaadi ke baad palat mat jana! ❤️</h1>
    <button class="btn" id="yes-btn" onclick="location.reload()">Reset</button>
</div>

<script>
    function nextPage(id) {
        document.querySelectorAll('.container').forEach(p => p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function moveNoButton() {
        const btn = document.getElementById('no-btn');
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
    }
</script>

</body>
</html>
