<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja - Web Version</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(135deg, #2c3e50, #000000);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            pointer-events: auto;
        }
        #game-over h1 {
            font-size: 48px;
            color: #e74c3c;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        #game-over p {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #restart-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background: #2ecc71;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Your Score: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let fruits = [];
    let particles = [];
    let sliceTrail = [];

    // Fruit Types configuration
    const fruitTypes = [
        { name: 'Watermelon', color: '#2ecc71', innerColor: '#e74c3c', radius: 35, points: 1 },
        { name: 'Orange', color: '#f39c12', innerColor: '#f1c40f', radius: 28, points: 2 },
        { name: 'Apple', color: '#c0392b', innerColor: '#f1c40f', radius: 30, points: 1 },
        { name: 'Bomb', color: '#333333', innerColor: '#e74c3c', radius: 30, isBomb: true }
    ];

    class Fruit {
        constructor() {
            this.reset();
        }

        reset() {
            const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            this.x = Math.random() * (canvas.width - 200) + 100;
            this.y = canvas.height + 50;
            
            // Trajectory calculation
            const angle = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
            const speed = Math.random() * 4 + 11;
            
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.gravity = 0.35;
            
            this.radius = type.radius;
            this.color = type.color;
            this.innerColor = type.innerColor;
            this.points = type.points;
            this.isBomb = type.isBomb || false;
            this.sliced = false;
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.rotation += this.rotSpeed;

            // Check if fruit falls off screen without being sliced
            if (!this.sliced && this.y > canvas.height + 60 && this.vy > 0) {
                if (!this.isBomb) {
                    lives--;
                    document.getElementById('lives').innerText = lives;
                    if (lives <= 0) {
                        endGame();
                    }
                }
                this.reset();
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            if (this.isBomb) {
                // Draw Bomb
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                // Fuse
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.quadraticCurveTo(10, -this.radius - 15, 15, -this.radius - 20);
                ctx.strokeStyle = '#f39c12';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // Draw Fruit Outer
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Draw Fruit Inner texture effect
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = this.innerColor;
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 6 + 4;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.02;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.2; // gravity
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    // Initialize game entities
    for (let i = 0; i < 3; i++) {
        fruits.push(new Fruit());
    }

    // Mouse / Touch Slicing Mechanics
    let isDrawing = false;

    canvas.addEventListener('mousedown', (e) => {
        if (isGameOver) return;
        isDrawing = true;
        sliceTrail = [{x: e.offsetX, y: e.offsetY}];
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || isGameOver) return;
        const currentPoint = {x: e.offsetX, y: e.offsetY};
        sliceTrail.push(currentPoint);
        if (sliceTrail.length > 10) sliceTrail.shift();

        checkSlice(currentPoint);
    });

    window.addEventListener('mouseup', () => {
        isDrawing = false;
        sliceTrail = [];
    });

    // Touch support for mobile/tablets
    canvas.addEventListener('touchstart', (e) => {
        if (isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        isDrawing = true;
        sliceTrail = [{x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top}];
        e.preventDefault();
    });

    canvas.addEventListener('touchmove', (e) => {
        if (!isDrawing || isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const currentPoint = {x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top};
        sliceTrail.push(currentPoint);
        if (sliceTrail.length > 10) sliceTrail.shift();

        checkSlice(currentPoint);
        e.preventDefault();
    });

    window.addEventListener('touchend', () => {
        isDrawing = false;
        sliceTrail = [];
    });

    function checkSlice(point) {
        fruits.forEach(fruit => {
            if (!fruit.sliced) {
                const dist = Math.hypot(fruit.x - point.x, fruit.y - point.y);
                if (dist < fruit.radius + 10) {
                    fruit.sliced = true;
                    
                    if (fruit.isBomb) {
                        endGame();
                    } else {
                        score += fruit.points;
                        document.getElementById('score').innerText = score;

                        // Create juice splash particles
                        for (let i = 0; i < 15; i++) {
                            particles.push(new Particle(fruit.x, fruit.y, fruit.innerColor));
                        }

                        // Reset fruit immediately after slice
                        setTimeout(() => {
                            fruit.reset();
                        }, 100);
                    }
                }
            }
        });
    }

    function endGame() {
        isGameOver = true;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'block';
    }

    function restartGame() {
        score = 0;
        lives = 3;
        isGameOver = false;
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
        document.getElementById('game-over').style.display = 'none';
        fruits.forEach(f => f.reset());
    }

    // Main Game Loop
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Update and draw fruits
        fruits.forEach(fruit => {
            if (!isGameOver) fruit.update();
            fruit.draw();
        });

        // Update and draw particles
        particles.forEach((particle, index) => {
            particle.update();
            particle.draw();
            if (particle.alpha <= 0) particles.splice(index, 1);
        });

        // Draw Blade/Slice Trail
        if (sliceTrail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
            for (let i = 1; i < sliceTrail.length; i++) {
                ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.stroke();
            ctx.shadowBlur = 0; // reset shadow
        }

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
